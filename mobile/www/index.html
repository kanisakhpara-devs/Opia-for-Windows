<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0e0e10">
<title>Opia</title>
<link rel="icon" href="img/opia-icon.svg">
<link rel="stylesheet" href="css/app.css">
<script>
  /* the theme before anything paints: dark, light, or whatever the phone uses */
  try { const t = localStorage.getItem('opia-theme'); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; } catch (e) { /* storage blocked */ }
</script>
</head>
<body>
<div id="app">
  <header class="top" id="top">
    <h1 id="title"><img src="img/opia-icon.svg" alt="" class="logo"> <span>Opia</span></h1>
    <div class="top-actions" id="topActions"></div>
  </header>
  <main id="views"></main>
  <nav class="tabs" id="tabs" aria-label="Workspaces"></nav>
</div>
<div id="layer"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<input type="file" id="picker" hidden>

<script src="js/core.js"></script>
<script src="vendor/pdfjs/pdf.min.js"></script>
<script src="vendor/pdf-lib.min.js"></script>
<script src="js/music-engine.js"></script>
<script src="js/develop.js"></script>
<script src="js/lens.js"></script>
<script src="js/imagine.js"></script>
<script src="js/folio.js"></script>
<script src="js/groove.js"></script>
<script src="js/main.js"></script>
</body>
</html>
