# Builds Opia.exe on Windows and publishes each build as a release (v1.0.<run>). The app's update wizard downloads it
# from there, and the newest is always at
# https://github.com/kanisakhpara-devs/Opia-for-Windows/releases/latest/download/Opia.exe
name: Windows

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # the history since the last release becomes its notes

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install what Opia needs
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Stamp the version
        shell: bash
        run: echo "{\"version\": \"1.0.${{ github.run_number }}\", \"commit\": \"${GITHUB_SHA}\"}" > server/build.json

      - name: Build Opia.exe
        run: >
          python -m PyInstaller --noconfirm --onefile --windowed --name Opia --icon web/img/opia.ico --splash web/img/opia.png
          --add-data "web;web" --add-data "models;models" --add-data "plugins;plugins" --add-data "server/build.json;server"
          --collect-submodules PIL --collect-all webview --collect-all soundfile --collect-all _soundfile_data --collect-all pillow_heif
          --collect-all pypdfium2 --collect-all pypdfium2_raw --collect-submodules pypdf --collect-submodules cryptography --collect-all imageio_ffmpeg
          run.py

      # make sure the exe actually starts and answers before publishing it
      - name: Smoke test
        shell: pwsh
        run: |
          $p = Start-Process dist\Opia.exe -ArgumentList '--no-window','--port','8765','--home',"$env:RUNNER_TEMP\opia-home" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60 -and -not $ok; $i++) {
            Start-Sleep 2
            try { $r = Invoke-WebRequest http://127.0.0.1:8765/api/update_settings -Method Post -Body '{}' -ContentType 'application/json' -UseBasicParsing; $ok = $r.StatusCode -eq 200; Write-Host $r.Content } catch { }
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw 'Opia.exe did not start' }
          Get-Item dist\Opia.exe | Format-List Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: Opia-windows-1.0.${{ github.run_number }}
          path: dist/Opia.exe

      - name: Publish the release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: 1.0.${{ github.run_number }}
        run: |
          # the notes are what changed since the last release, one line per change: the app's update wizard shows them
          prev=$(git describe --tags --abbrev=0 --match 'v1.*' HEAD^ 2>/dev/null || true)
          if [ -n "$prev" ]; then notes=$(git log --no-merges --format='- %s' "$prev"..HEAD); else notes=$(git log -1 --format='- %s'); fi
          gh release create "v$VERSION" dist/Opia.exe --target "$GITHUB_SHA" --latest \
            --title "Opia for Windows $VERSION" --notes "$notes"
