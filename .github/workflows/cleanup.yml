# One-off: delete the old "Opia for Android 0.1.1" release (tag `android`) left over from before the split. Removed after it runs.
name: Cleanup
on:
  push:
    branches: [main-n8y2uy]
    paths: ['.github/workflows/cleanup.yml']
permissions:
  contents: write
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete android --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
