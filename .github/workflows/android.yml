# Builds Opia for Android and puts the APK on the "android" release, so the newest build is always at
# https://github.com/kanisakhpara-devs/Opia/releases/download/android/Opia.apk
name: Android

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'web/js/music-engine.js'
      - 'web/samples/**'
      - 'web/fonts/**'
      - 'web/img/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # optional: a private signing key from the repository's secrets (see mobile/README.md)
      - name: Signing key
        env:
          KEY: ${{ secrets.OPIA_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.OPIA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.OPIA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.OPIA_KEY_PASSWORD }}
        if: ${{ env.KEY != '' }}
        run: |
          echo "$KEY" | base64 -d > "$RUNNER_TEMP/opia.jks"
          {
            echo "OPIA_KEYSTORE=$RUNNER_TEMP/opia.jks"
            echo "OPIA_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "OPIA_KEY_ALIAS=$KEY_ALIAS"
            echo "OPIA_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build the APK
        working-directory: mobile/android
        env:
          OPIA_VERSION_CODE: ${{ github.run_number }}
          OPIA_VERSION_NAME: 0.1.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Opia.apk"
          ls -la "$RUNNER_TEMP/Opia.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Opia-android-0.1.${{ github.run_number }}
          path: ${{ runner.temp }}/Opia.apk

      - name: Publish to the android release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: 0.1.${{ github.run_number }}
        run: |
          git tag -f android "$GITHUB_SHA"
          git push -f origin refs/tags/android
          notes="Opia for Android $VERSION, built from ${GITHUB_SHA::7}. Download Opia.apk on your phone and open it to install. See mobile/README.md."
          if gh release view android >/dev/null 2>&1; then
            gh release edit android --title "Opia for Android $VERSION" --notes "$notes" --prerelease
          else
            gh release create android --title "Opia for Android $VERSION" --notes "$notes" --prerelease --verify-tag
          fi
          gh release upload android "$RUNNER_TEMP/Opia.apk" --clobber
